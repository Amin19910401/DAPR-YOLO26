  - [[-1, 4], 1, Concat, [1]]                    # 16
  - [-1, 2, C3k2, [256, True]]                   # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 2], 1, Concat, [1]]                    # 19
  - [-1, 2, C3k2, [128, True]]                   # 20 (P2)
  - [-1, 1, Conv, [128, 3, 2]]                   # 21
  - [[-1, 17], 1, Concat, [1]]                   # 22
  - [-1, 2, C3k2, [256, True]]                   # 23 (P3 out)
  - [-1, 1, Conv, [256, 3, 2]]                   # 24
  - [[-1, 14], 1, Concat, [1]]                   # 25
  - [-1, 2, C3k2, [512, True]]                   # 26 (P4 out)
  - [[20, 23, 26], 1, Detect, [nc]]              # 27